# Ruff, tests on Python 3.11-3.14 and a workflow lint.
# The jobs live in ChiefGyk3D/git-your-ship-together; this file only says what
# is specific to AInvestment planner.
name: CI

on:
  push:
    branches: [claude/investment-portfolio-optimizer-8ej8jt]
  pull_request:
    branches: [claude/investment-portfolio-optimizer-8ej8jt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@9d6825dd4e0e4d524fca3733f416437bbd7851e1 # v1.31.0
    permissions:
      contents: read
      id-token: write   # coverage upload job; the reusable workflow requests it
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
      # The suite runs on the synthetic provider, so it needs no network.
      test-command: pytest -q
      docker-build: false
      egress-policy: block
